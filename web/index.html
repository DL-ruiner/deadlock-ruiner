<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deadlock Ruiner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Onest:wght@400;500;600;700&family=Roboto+Condensed:wght@500;700&display=swap">
<style>
/* Layout: sticky brass header, crew strip on top, feed and match views below; one dark "patron hall" look */
:root{
  --ink:#0d1110; --slab:#141a18; --slab2:#1b2320; --rule:#2a3531; --rule2:#38463f;
  --parch:#ece3cf; --dust:#98a196; --brass:#c8a25a; --brass2:#e2c17f;
  --blood:#d4553f; --jade:#5fbf8f; --gold:#e6c14a;
  --amber:#f0a43a; --sapphire:#6f8dff;
  --display:'Forum',Georgia,serif; --body:'Onest',system-ui,sans-serif; --num:'Roboto Condensed','Arial Narrow',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;min-height:100vh;color:var(--parch);font:15px/1.5 var(--body);
  background:radial-gradient(1200px 500px at 50% -200px, rgba(200,162,90,.10), transparent 70%), var(--ink)}
a{color:inherit}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(13,17,16,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--rule)}
.bar-in{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:22px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:38px;height:38px}
.brand b{font:400 26px/1 var(--display);letter-spacing:.14em;color:var(--parch)}
.brand b span{color:var(--blood)}
.brand small{display:block;font:500 10px/1 var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--brass);margin-top:4px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--dust);text-decoration:none;font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px}
nav a:hover{color:var(--parch)}
nav a.on{color:var(--ink);background:var(--brass)}
main{max-width:1600px;margin:0 auto;padding-block:18px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

h2{font:400 30px/1.1 var(--display);letter-spacing:.04em;margin:0;text-wrap:balance}
h3{font:400 21px/1.2 var(--display);letter-spacing:.04em;margin:0 0 8px;color:var(--brass2)}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}
.muted{color:var(--dust)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.ok{color:var(--jade)} .no{color:var(--blood)} .meh{color:var(--gold)}
.t2{color:var(--amber)} .t3{color:var(--sapphire)}

.panel{background:var(--slab);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;min-width:0}
.stack{display:grid;gap:14px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--slab2);border:1px solid var(--rule);white-space:nowrap}
.pill.good{color:var(--jade)} .pill.bad{color:var(--blood)} .pill.warn{color:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--brass);color:var(--ink);border:none;border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px}
.btn:hover{background:var(--brass2)}
.btn.ghost{background:transparent;color:var(--parch);border:1px solid var(--rule2)}
.btn.ghost:hover{border-color:var(--brass)}
input[type=text],input:not([type]){background:var(--ink);border:1px solid var(--rule2);color:var(--parch);border-radius:8px;padding:7px 10px}
.hi{width:28px;height:28px;border-radius:6px;vertical-align:middle;background:var(--slab2);object-fit:cover;flex:none}
.hi.s{width:22px;height:22px;border-radius:50%}
.hi.l{width:44px;height:44px;border-radius:10px}
.scroll{overflow-x:auto}

/* crew strip */
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mate{display:grid;gap:8px;text-decoration:none;background:linear-gradient(180deg,var(--slab2),var(--slab));border:1px solid var(--rule);border-radius:12px;padding:12px 14px;transition:border-color .15s,transform .15s}
.mate:hover{border-color:var(--brass);transform:translateY(-2px)}
.mate .nm{font:400 22px/1.1 var(--display);letter-spacing:.03em}
.gauge{height:6px;border-radius:3px;background:var(--ink);overflow:hidden}
.gauge i{display:block;height:100%}

/* match feed */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--slab2);border:1px solid var(--rule);color:var(--dust);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:600;font-size:13px}
.chip.on{color:var(--ink);background:var(--parch);border-color:var(--parch)}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.mcard{cursor:pointer;display:grid;gap:8px;border-left:3px solid var(--rule2);transition:border-color .15s}
.mcard.win{border-left-color:var(--jade)} .mcard.loss{border-left-color:var(--blood)}
.mcard:hover{border-color:var(--brass)}
.mcard .res{font:400 22px/1 var(--display);letter-spacing:.05em}

/* match view */
.banner{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.layout{display:grid;grid-template-columns:minmax(320px,680px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1100px){.layout{grid-template-columns:1fr}}
#map{cursor:grab;touch-action:none;width:100%;max-width:100%;aspect-ratio:1;background:#0b0f0e;border-radius:12px;border:1px solid var(--rule);display:block}
.controls{display:flex;align-items:center;gap:6px;margin:8px 0;flex-wrap:wrap}
.controls button{background:var(--slab2);color:var(--parch);border:1px solid var(--rule);border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:600}
.controls button.on{border-color:var(--brass);color:var(--brass2)}
.layers{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--dust);margin:4px 0 8px}
.layers label{cursor:pointer;user-select:none}
#clock{font-family:var(--num);font-variant-numeric:tabular-nums;min-width:90px}
#timeline{width:100%;height:70px;display:block;background:var(--slab);border-radius:8px;border:1px solid var(--rule);cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 7px;text-align:left;white-space:nowrap}
td{font-variant-numeric:tabular-nums}
th{color:var(--dust);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
tbody tr{border-top:1px solid var(--rule)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--slab2)}
tbody tr.sel{background:#232d29}
.bar{height:6px;border-radius:3px;background:var(--ink);width:80px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.bar i{display:block;height:100%}
.teamhead{font:400 19px/1.3 var(--display);letter-spacing:.06em;margin:4px 0 2px}
.moments{max-height:520px;overflow:auto}
.mo{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:7px 4px;border-top:1px solid var(--rule);cursor:pointer}
.mo:hover{background:var(--slab2)}
.mo .c{font-family:var(--num);color:var(--dust)}
.mo b.g{color:var(--jade)} .mo b.b{color:var(--blood)}
.tags span{display:inline-block;margin:2px 4px 2px 0;padding:2px 9px;border-radius:6px;font-size:12px}
.tags .b{background:#3a1f1b;color:#f2b2a6} .tags .g{background:#173327;color:#a6f0c8}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin:12px 0 10px;flex-wrap:wrap}
.tabs button{background:none;border:none;color:var(--dust);cursor:pointer;font-weight:600;padding:7px 11px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--parch);border-color:var(--brass)}
.filters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.filters button{background:var(--slab2);border:1px solid transparent;color:var(--dust);cursor:pointer;font-weight:600;padding:2px 9px;border-radius:6px;font-size:12px}
.filters button.on{color:var(--parch);border-color:var(--rule2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin:8px 0}
.kpi{background:var(--slab2);border:1px solid var(--rule);border-radius:10px;padding:9px 11px}
.kpi b{display:block;font:700 22px/1.15 var(--num);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--dust)}
.tips{padding-left:18px;margin:6px 0}
.tips li{margin:5px 0}
.hbar{display:grid;grid-template-columns:minmax(120px,170px) 1fr 70px;gap:8px;align-items:center;margin:4px 0;font-size:13px}
.hbar .track{height:10px;background:var(--ink);border-radius:5px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--brass)}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--ink)}
.split i{display:block;height:100%}
canvas.chart{width:100%;height:200px;display:block;background:var(--slab2);border-radius:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--dust);margin:4px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.item{display:flex;gap:7px;align-items:center;background:var(--slab2);border:1px solid var(--rule);border-radius:8px;padding:5px 7px;font-size:12px}
.item img{width:30px;height:30px;border-radius:6px;background:var(--ink);flex:none}
.item.weapon{border-left:3px solid #e39a3b} .item.vitality{border-left:3px solid #6cc06a} .item.spirit{border-left:3px solid #b07cff}
.item.weapon img{background:#7a4a14} .item.vitality img{background:#2f5e2c} .item.spirit img{background:#4b2f7a}
.ico{width:26px;height:26px;border-radius:5px;padding:2px;flex:none}
.ico.weapon{background:#7a4a14} .ico.vitality{background:#2f5e2c} .ico.spirit{background:#4b2f7a}
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.award{background:var(--slab2);border:1px solid var(--rule);border-radius:12px;padding:12px}
.award .t{font:400 19px/1.2 var(--display);color:var(--brass2)}
.trend{display:flex;align-items:flex-end;gap:4px;height:90px;padding:6px 0;border-bottom:1px solid var(--rule)}
.trend a{flex:1;max-width:36px;border-radius:4px 4px 0 0;min-height:4px;display:block}
.empty{padding:40px;text-align:center}
code{background:var(--slab2);padding:1px 6px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar-in">
  <a class="brand" href="#"><img src="logo.svg" alt=""><div><b>RUIN<span>E</span>R</b><small>Deadlock · разбор матчей</small></div></a>
  <nav><a href="#" id="navHome">Матчи</a><a href="#crew" id="navCrew">Компания</a><a href="#how" id="navHow">Как считаем</a></nav>
</div></header>
<main id="app"></main>

<script>
const TEAM = {2: {name: 'Hidden King', cls: 't2', color: '#f0a43a'}, 3: {name: 'Archmother', cls: 't3', color: '#6f8dff'}};
const STEAM64 = 76561197960265728;
const app = document.getElementById('app');
const store = {get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
               set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }};
let index = [], stopReplay = null, MAPDATA = null, HEROES = {}, ITEMS = {}, BENCH = null, CONFIG = null, FRIENDS = [], HAS_API = null;
const IMG = {};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const clock = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const ruinColor = r => r > 62 ? 'var(--blood)' : r > 35 ? 'var(--gold)' : 'var(--jade)';
const verdictCls = v => v === 'Тащил' ? 'good' : v === 'Норм' ? 'warn' : 'bad';
const k = n => n == null ? '—' : n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(Math.round(n));
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const fix = (v, d = 1) => v == null ? '—' : Number(v).toFixed(d);
const heroIcon = (id, cls = '') => HEROES[id]?.sm ? `<img class="hi ${cls}" src="${HEROES[id].sm}" alt="${esc(HEROES[id].name)}" title="${esc(HEROES[id].name)}">` : '';
const heroName = id => HEROES[id]?.name || `hero ${id}`;
const friendOf = acc => FRIENDS.find(f => f.account_id === acc);
function img(src) {
  if (!src) return null;
  if (!IMG[src]) { IMG[src] = new Image(); IMG[src].src = src }
  return IMG[src];
}
async function getJSON(url, fallback) { try { const r = await fetch(url, {cache: 'no-store'}); return r.ok ? await r.json() : fallback } catch { return fallback } }

async function loadStatic() {
  if (!MAPDATA) [MAPDATA, HEROES, ITEMS, BENCH, CONFIG] = await Promise.all([
    getJSON('assets/map.json', null), getJSON('assets/heroes.json', {}), getJSON('assets/items.json', {}),
    getJSON('assets/bench.json', null), getJSON('config.json', {})]);
  if (HAS_API === null) HAS_API = location.hostname.endsWith('github.io') ? false
    : await fetch('api/ping', {cache: 'no-store'}).then(r => r.ok).catch(() => false);
  const file = await getJSON('friends.json', []);
  const all = [...file, ...store.get('friends', []).map(f => ({...f, local: true}))];
  FRIENDS = all.filter((f, i) => all.findIndex(g => g.account_id === f.account_id) === i);
}

async function route() {
  if (stopReplay) { stopReplay(); stopReplay = null }
  await loadStatic();
  index = await getJSON('reports/index.json', []);
  const h = location.hash;
  const page = /^#m\d+$/.test(h) ? 'match' : /^#p\d+$/.test(h) ? 'player' : h === '#crew' || h === '#friends' ? 'crew' : h === '#how' ? 'how' : 'home';
  document.getElementById('navHome').classList.toggle('on', page === 'home' || page === 'match');
  document.getElementById('navCrew').classList.toggle('on', page === 'crew' || page === 'player');
  document.getElementById('navHow').classList.toggle('on', page === 'how');
  window.scrollTo(0, 0);
  if (page === 'match') return showMatch(h.slice(2));
  if (page === 'player') return showPlayer(Number(h.slice(2)));
  if (page === 'crew') return showCrew();
  if (page === 'how') return showHow();
  showHome();
}
window.addEventListener('hashchange', route);

/* ---------------- aggregates ---------------- */
function gamesOf(acc) {
  return index.flatMap(m => m.players.filter(p => p.account_id === acc).map(p => ({m, p}))).sort((a, b) => a.m.match_id - b.m.match_id);
}
function crewStats(f) {
  const g = gamesOf(f.account_id), n = g.length;
  const S = key => avg(g.map(x => x.p.s?.[key]).filter(v => v != null));
  const heroes = {};
  g.forEach(x => { const h = heroes[x.p.hero_id] ||= {n: 0, ruin: 0}; h.n++; h.ruin += x.p.ruin });
  const mist = {}, good = {};
  g.forEach(x => { for (const [t, c] of Object.entries(x.p.mist || {})) mist[t] = (mist[t] || 0) + c;
                   for (const [t, c] of Object.entries(x.p.good || {})) good[t] = (good[t] || 0) + c });
  return {f, g, n, ruin: avg(g.map(x => x.p.ruin)), wins: g.filter(x => x.p.won).length,
    ruiner: g.filter(x => x.m.ruiner === x.p.hero_id).length, mvp: g.filter(x => x.m.mvp === x.p.hero_id).length,
    k: S('kills'), d: S('deaths'), a: S('assists'), spm: S('spm'), dpm: S('dpm'), hs: S('hs_pct'), kp: S('kp'),
    iso: S('isolated_deaths'), ultd: S('ult_deaths'), lane: S('lane_diff'), camp: S('camp_share'), join: S('join_s'), lh10: S('lh10'),
    heroes: Object.entries(heroes).map(([id, v]) => ({id: +id, n: v.n, ruin: v.ruin / v.n})).sort((a, b) => b.n - a.n),
    mist: Object.entries(mist).sort((a, b) => b[1] - a[1]), good: Object.entries(good).sort((a, b) => b[1] - a[1])};
}

function duoStats() {
  const crew = new Map(FRIENDS.map(f => [f.account_id, f]));
  const pairs = {};
  for (const m of index) for (const pr of m.pairs || []) {
    if (!crew.has(pr.a) || !crew.has(pr.b)) continue;
    const [a, b] = pr.a < pr.b ? [pr.a, pr.b] : [pr.b, pr.a];
    const pa = m.players.find(p => p.account_id === a), pb = m.players.find(p => p.account_id === b);
    const d = pairs[a + ':' + b] ||= {a: crew.get(a), b: crew.get(b), n: 0, wins: 0, ruin: 0, died: 0, kills: 0};
    d.n++; d.wins += pa.won ? 1 : 0; d.ruin += (pa.ruin + pb.ruin) / 2; d.died += pr.died; d.kills += pr.kills;
  }
  return Object.values(pairs).map(d => ({...d, wr: d.wins / d.n, ruin: d.ruin / d.n, diedPer: d.died / d.n, killsPer: d.kills / d.n}))
    .sort((x, y) => y.n - x.n || y.wr - x.wr);
}
function duoTable(list) {
  return list.length ? `<div class="scroll"><table><thead><tr><th>Пара</th><th>Матчей</th><th>Победы</th><th>Средний руин пары</th><th>Убийств вместе</th><th>Умерли вдвоём</th></tr></thead><tbody>
    ${list.map(d => `<tr><td><b>${esc(d.a.name)}</b> + <b>${esc(d.b.name)}</b></td><td class="num">${d.n}</td>
      <td class="num ${d.wr >= .5 ? 'ok' : 'no'}">${d.wins}/${d.n} · ${Math.round(d.wr * 100)}%</td>
      <td><span class="bar"><i style="width:${d.ruin}%;background:${ruinColor(d.ruin)}"></i></span><b class="num">${d.ruin.toFixed(0)}</b></td>
      <td class="num">${d.killsPer.toFixed(1)}/матч</td><td class="num ${d.diedPer >= 1.5 ? 'no' : ''}">${d.diedPer.toFixed(1)}/матч</td></tr>`).join('')}
    </tbody></table></div>
    <p class="muted" style="font-size:12px">«Убийств вместе» — убийство, где участвовали оба (килл или ассист). «Умерли вдвоём» — смерти с разницей до 6 секунд рядом друг с другом.</p>`
    : '<p class="muted">Пока нет матчей, где двое из компании играли в одной команде.</p>';
}

function requestLink(text) {
  return CONFIG?.repo ? `https://github.com/${CONFIG.repo}/issues/new?template=match.yml&title=${encodeURIComponent(text)}` : null;
}

/* ---------------- home ---------------- */
let feedFilter = 'all', intakeTab = 'match', pollTimer = null;
function showHome() {
  const crew = FRIENDS.map(crewStats);
  app.innerHTML = `
  <div class="stack">
    <section>
      <div class="row" style="margin-bottom:10px"><h2>Компания</h2><span class="spacer"></span><a class="btn ghost" href="#crew">Рейтинг и номинации →</a></div>
      <div class="crew">${crew.map(mateCard).join('')}</div>
    </section>
    ${intakeHtml()}
    <section>
      <div class="row" style="margin-bottom:10px"><h2>Матчи</h2><span class="muted num">${index.length}</span><span class="spacer"></span>
        <div class="chips">${[['all', 'Все'], ...FRIENDS.map(f => [String(f.account_id), f.name])].map(([v, l]) =>
          `<button class="chip ${feedFilter === v ? 'on' : ''}" data-ff="${v}">${esc(l)}</button>`).join('')}</div></div>
      <div id="feed"></div>
    </section>
  </div>`;
  app.querySelectorAll('[data-ff]').forEach(b => b.onclick = () => { feedFilter = b.dataset.ff; showHome() });
  bindIntake();
  renderFeed(document.getElementById('feed'), feedFilter === 'all' ? index : index.filter(m => m.players.some(p => String(p.account_id) === feedFilter)));
}

function mateCard(c) {
  const top = c.heroes[0];
  const last = c.g[c.g.length - 1];
  return `<a class="mate" href="#p${c.f.account_id}">
    <div class="row" style="gap:10px">${top ? heroIcon(top.id, 'l') : '<span class="hi l"></span>'}
      <div><div class="nm">${esc(c.f.name)}</div><div class="muted" style="font-size:12px">${c.n ? `${c.n} матч. · побед ${c.wins}` : 'нет разобранных матчей'}</div></div></div>

function bindIntake() {
  if (!HAS_API && !CONFIG?.repo) return;
  app.querySelectorAll('[data-it]').forEach(b => b.onclick = () => { intakeTab = b.dataset.it; showHome() });
  const input = document.getElementById('intakeInput'), out = document.getElementById('intakeOut');
  if (!HAS_API) {
    const link = document.getElementById('intakeLink');
    const upd = () => link.href = requestLink((intakeTab === 'match' ? 'match ' : 'player ') + input.value.trim());
    input.oninput = upd; upd();
    document.getElementById('intakeForm').onsubmit = e => { e.preventDefault(); link.click() };
    return;
  }
  document.getElementById('intakeForm').onsubmit = async e => {
    e.preventDefault();
    const v = input.value.trim();
    if (!v) return;
    if (intakeTab === 'match') {
      const res = await postJSON('api/match', {match: v});
      out.innerHTML = res.error ? `<span class="no">${esc(res.error)}</span>` : `<span class="ok">Матч ${res.queued[0]} в очереди</span>`;
    } else {
      out.innerHTML = '<span class="muted">Ищу…</span>';
      const list = await getJSON('api/search?q=' + encodeURIComponent(v), []);
      if (list.error || !list.length) { out.innerHTML = '<span class="no">Никого не нашёл. Попробуй точный ник или friend code.</span>'; return }
      out.innerHTML = list.map(p => `<div class="row" style="padding:5px 0;border-top:1px solid var(--rule)">
        ${p.avatar ? `<img class="hi" src="${esc(p.avatar)}" alt="">` : ''}<b>${esc(p.name || 'account ' + p.account_id)}</b>
        <span class="muted num">${p.account_id}${p.matches_30d != null ? ' · ' + p.matches_30d + ' матчей за 30 дней' : ''}</span><span class="spacer"></span>
        <button class="btn ghost" data-acc="${p.account_id}">Разобрать 5 последних</button></div>`).join('');
      out.querySelectorAll('[data-acc]').forEach(b => b.onclick = async () => {
        b.disabled = true; b.textContent = 'Ставлю в очередь…';
        const res = await postJSON('api/player', {account_id: Number(b.dataset.acc), n: 5});
        b.textContent = res.error ? 'Ошибка' : `В очереди: ${res.queued.length}`; pollJobs();
      });
    }
    pollJobs();
  };
  pollJobs();
}
async function postJSON(url, body) {
  try { return await (await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})).json() }
  catch { return {error: 'Сервер не отвечает'} }
}
const JOB_LABEL = {queued: 'в очереди', downloading: 'качаю демку', analyzing: 'анализирую', done: 'готово', error: 'ошибка'};
let lastDone = null;
async function pollJobs() {
  clearTimeout(pollTimer);
  const box = document.getElementById('jobs');
  if (!box) return;
  const list = await getJSON('api/jobs', []);
  box.innerHTML = list.map(j => `<div class="row" style="font-size:13px;gap:10px">
    <span class="${j.status === 'done' ? 'ok' : j.status === 'error' ? 'no' : 'meh'}" style="min-width:110px">${JOB_LABEL[j.status] || j.status}</span>
    ${j.status === 'done' ? `<a href="#m${j.match_id}" class="num">#${j.match_id}</a>` : `<span class="num">#${j.match_id}</span>`}
    ${j.error ? `<span class="muted">${esc(j.error)}</span>` : ''}</div>`).join('');
  const done = list.filter(j => j.status === 'done').map(j => j.match_id).join();
  if (lastDone !== null && done !== lastDone) { index = await getJSON('reports/index.json', []); showHome(); return }
  lastDone = done;
  if (list.some(j => ['queued', 'downloading', 'analyzing'].includes(j.status))) pollTimer = setTimeout(pollJobs, 3000);
}

/* ---------------- charts ---------------- */
function lineChart(canvas, series, N, opts = {}) {
  const dpr = devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const c = canvas.getContext('2d'); c.scale(dpr, dpr);
  const pad = {l: 40, r: 8, t: 8, b: 18};
  const max = Math.max(1, ...series.flatMap(s => s.data));
  const X = i => pad.l + i / (N - 1) * (w - pad.l - pad.r), Y = v => h - pad.b - v / max * (h - pad.t - pad.b);
  c.font = '11px "Roboto Condensed", sans-serif'; c.fillStyle = '#98a196'; c.strokeStyle = '#2a3531';
  for (let g = 0; g <= 4; g++) {
    const v = max * g / 4; c.beginPath(); c.moveTo(pad.l, Y(v)); c.lineTo(w - pad.r, Y(v)); c.stroke();
    c.fillText(k(Math.round(v)), 2, Y(v) + 3);
  }
  for (let m = 0; m < N; m += 300) c.fillText(clock(m), X(m) - 8, h - 4);
  for (const s of series) {
    c.strokeStyle = s.color; c.lineWidth = s.width || 1.5; c.setLineDash(s.dash || []); c.beginPath();
    s.data.forEach((v, i) => i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v))); c.stroke();
  }
  c.setLineDash([]);
  for (const mk of opts.marks || []) { c.fillStyle = mk.color; c.fillRect(X(mk.t) - 1, pad.t, 2, h - pad.t - pad.b) }
}

/* ---------------- match view ---------------- */
async function showMatch(id) {

  let t = 0, playing = false, speed = 8, tab = 'overview', filter = 'all', cat = 'all', focus = null;

  app.innerHTML = `

        <span class="spacer"></span>
        <button id="zin" aria-label="Приблизить">+</button><button id="zout" aria-label="Отдалить">−</button>
        <button id="zfollow">Следить</button><button id="zreset">Вся карта</button>
      </div>
      <div class="layers">
        ${[['camps', 'Кемпы'], ['zips', 'Зиплайны'], ['shops', 'Магазины'], ['statues', 'Статуи'], ['heat', 'Тепловая карта игрока'], ['trail', 'След'], ['names', 'Имена']]
          .map(([k2, l]) => `<label><input type="checkbox" id="layer-${k2}" data-layer="${k2}" ${layers[k2] ? 'checked' : ''}> ${l}</label>`).join('')}
      </div>
      <canvas id="timeline" width="1100" height="100"></canvas>
      <div class="muted" style="font-size:12px;margin-top:4px">Линия — разница душ команд (вверх — Hidden King). Метки — моменты выбранного игрока: сверху хорошие, снизу ошибки.</div>
    </div>
    <div class="stack">
      <div class="panel scroll" id="board"></div>
      <div class="panel" id="detail"></div>
    </div>
  </div>`;

  const map = document.getElementById('map'), ctx = map.getContext('2d');
  const tl = document.getElementById('timeline'), tctx = tl.getContext('2d');
  const W = map.width, R = MAPDATA?.radius || 10752;
  const px = x => (x + R) / (2 * R) * W, py = y => (R - y) / (2 * R) * W;
  const view = {z: 1, cx: W / 2, cy: W / 2, follow: false};
  const sx = x => (px(x) - view.cx) * view.z + W / 2, sy = y => (py(y) - view.cy) * view.z + W / 2;
  function clampView() {
    view.z = Math.min(6, Math.max(1, view.z));
    const half = W / 2 / view.z;
    view.cx = Math.min(W - half, Math.max(half, view.cx)); view.cy = Math.min(W - half, Math.max(half, view.cy));
  }
  // positions are sampled once per second; interpolate so playback moves smoothly
  function posAt(tr, tt) {
    const i = Math.min(N - 1, Math.floor(tt)), j = Math.min(N - 1, i + 1), f = tt - i;
    if (!tr.alive[i] || !tr.alive[j] || Math.hypot(tr.x[j] - tr.x[i], tr.y[j] - tr.y[i]) > 1500) return [tr.x[i], tr.y[i]];
    return [tr.x[i] + (tr.x[j] - tr.x[i]) * f, tr.y[i] + (tr.y[j] - tr.y[i]) * f];
  }

  const bg = document.createElement('canvas'); bg.width = bg.height = W;
  function buildBg() {
    const b = bg.getContext('2d');
    b.fillStyle = '#0b0f0e'; b.fillRect(0, 0, W, W);
    const mm = img(MAPDATA?.image);
    if (mm?.complete && mm.naturalWidth) {
      const tint = document.createElement('canvas'); tint.width = tint.height = W;
      const tc = tint.getContext('2d');
      tc.drawImage(mm, 0, 0, W, W); tc.globalCompositeOperation = 'source-in';
      tc.fillStyle = '#2f3a35'; tc.fillRect(0, 0, W, W);
      b.drawImage(tint, 0, 0);
    }
    if (layers.zips) for (const z of MAPDATA?.ziplines || []) {
      b.strokeStyle = z.color; b.globalAlpha = .55; b.lineWidth = 2.5; b.beginPath();
      z.points.forEach(([x, y], i) => i ? b.lineTo(px(x), py(y)) : b.moveTo(px(x), py(y))); b.stroke(); b.globalAlpha = 1;
    }
    const ent = MAPDATA?.entities || {};
    if (layers.statues) for (const s of ent.golden_statues || []) { b.fillStyle = '#d9b44a'; b.fillRect(px(s.x) - 2, py(s.y) - 2, 4, 4) }
    if (layers.shops) for (const s of ent.shops || []) {
      b.fillStyle = '#5fbf8f'; b.font = 'bold 15px sans-serif'; b.textAlign = 'center'; b.textBaseline = 'middle'; b.fillText('$', px(s.x), py(s.y));
    }
    for (const s of ent.teleporters || []) { b.strokeStyle = '#b07cff'; b.lineWidth = 2; b.beginPath(); b.arc(px(s.x), py(s.y), 6, 0, 7); b.stroke() }
    if (layers.heat) {
      const tr = r.track[sel];
      b.fillStyle = 'rgba(212,85,63,0.07)';
      for (let i = 0; i < N; i++) if (tr.alive[i]) { b.beginPath(); b.arc(px(tr.x[i]), py(tr.y[i]), 9, 0, 7); b.fill() }
    }
  }
  buildBg();
  if (MAPDATA?.image) { const mi = img(MAPDATA.image); if (!mi.complete) mi.addEventListener('load', () => { buildBg(); draw() }) }
  r.players.forEach(p => { const im = img(HEROES[p.hero_id]?.mm); if (im && !im.complete) im.addEventListener('load', () => draw()) });
  (MAPDATA?.camps || []).forEach(c => { const im = img(c.icon); if (im && !im.complete) im.addEventListener('load', () => draw()) });

  const spotDead = (r.objective_spots || []).map(s => {
    const d = r.objectives.find(o => o.team === s.team && Math.hypot(o.x - s.x, o.y - s.y) < 300);
    return d ? d.t : Infinity;
  });
  const campAlive = Object.fromEntries((r.camps || []).map(c => [c.i, c.alive]));
  const diffs = Array.from({length: N}, (_, i) => r.players.reduce((d, p) => d + (p.team === 2 ? 1 : -1) * (r.track[p.hero_id].nw[i] || 0), 0));
  const maxDiff = Math.max(1000, ...diffs.map(Math.abs));

  function drawTimeline() {
    const w = tl.width, h = tl.height, mid = h / 2;
    tctx.clearRect(0, 0, w, h);
    tctx.strokeStyle = '#2a3531'; tctx.beginPath(); tctx.moveTo(0, mid); tctx.lineTo(w, mid); tctx.stroke();
    tctx.lineWidth = 2;
    for (let i = 1; i < N; i++) {
      tctx.strokeStyle = diffs[i] >= 0 ? TEAM[2].color : TEAM[3].color;
      tctx.beginPath();
      tctx.moveTo((i - 1) / N * w, mid - diffs[i - 1] / maxDiff * (mid - 8));
      tctx.lineTo(i / N * w, mid - diffs[i] / maxDiff * (mid - 8)); tctx.stroke();
    }
    tctx.lineWidth = 1;
    for (const m of P[sel].moments) { tctx.fillStyle = m.good ? '#5fbf8f' : '#d4553f'; tctx.fillRect(m.t / N * w - 1.5, m.good ? 0 : h - 12, 3, 12) }
    tctx.fillStyle = '#ece3cf'; tctx.fillRect(t / N * w - 1, 0, 2, h);
  }
  tl.onclick = e => { const rc = tl.getBoundingClientRect(); t = (e.clientX - rc.left) / rc.width * N; focus = null; draw() };

  function objShape(o, x, y, dead) {
    const col = TEAM[o.team]?.color || '#aaa';
    ctx.strokeStyle = col; ctx.fillStyle = dead ? 'rgba(0,0,0,0)' : col + '55'; ctx.globalAlpha = dead ? .35 : 1; ctx.lineWidth = 2;
    const s = {patron: 13, walker: 10, shrine: 8, barracks: 7}[o.type] || 7;
    ctx.beginPath();
    if (o.type === 'shrine') { ctx.moveTo(x, y - s); ctx.lineTo(x + s, y); ctx.lineTo(x, y + s); ctx.lineTo(x - s, y); ctx.closePath() }
    else if (o.type === 'patron') ctx.arc(x, y, s, 0, 7);
    else ctx.rect(x - s, y - s, 2 * s, 2 * s);
    ctx.fill(); ctx.stroke();
    if (dead) { ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s); ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s); ctx.stroke() }
    ctx.globalAlpha = 1;
  }

  function draw() {
    const i = Math.min(N - 1, Math.floor(t));
    if (view.follow) { const [wx, wy] = posAt(r.track[sel], t); view.cx = sx(wx); view.cy = sy(wy); clampView() }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#0b0f0e'; ctx.fillRect(0, 0, W, W);
    ctx.setTransform(view.z, 0, 0, view.z, W / 2 - view.cx * view.z, W / 2 - view.cy * view.z);
    ctx.drawImage(bg, 0, 0);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (layers.camps) (MAPDATA?.camps || []).forEach((c, ci) => {
      const alive = (campAlive[ci] || []).some(([a, b]) => t >= a && t <= b);
      const im = img(c.icon), s = {strong: 26, medium: 22, weak: 18, vault: 22}[c.kind] || 20;
      ctx.globalAlpha = alive ? 1 : .25;
      ctx.fillStyle = c.kind === 'vault' ? '#3a2f12' : '#1c2a22'; ctx.strokeStyle = c.kind === 'vault' ? '#e0b24a' : '#7fd19b';
      ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx(c.x), sy(c.y), s / 2 + 3, 0, 7); ctx.fill(); ctx.stroke();
      if (im?.complete && im.naturalWidth) ctx.drawImage(im, sx(c.x) - s / 2, sy(c.y) - s / 2, s, s);
      ctx.globalAlpha = 1;
    });
    (r.objective_spots || []).forEach((o, oi) => objShape(o, sx(o.x), sy(o.y), t >= spotDead[oi]));
    for (const e of r.events || []) if (e.kind === 'rift' && t >= e.t && t - e.t < 20) {
      ctx.strokeStyle = TEAM[e.team]?.color || '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(sx(e.x), sy(e.y), 22, 0, 7); ctx.stroke();
    }
    for (const f of r.fights) if (t >= f.t && t <= f.end + 2) {
      ctx.strokeStyle = 'rgba(236,227,207,.4)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 2; ctx.beginPath();
      ctx.arc(sx(f.x), sy(f.y), 1500 / (2 * R) * W * view.z, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    }
    for (const kl of r.kills) if (t >= kl.t && t - kl.t < 10) {
      const a = 1 - (t - kl.t) / 10, x = sx(kl.x), y = sy(kl.y);
      ctx.strokeStyle = `rgba(212,85,63,${a})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x - 9, y - 9); ctx.lineTo(x + 9, y + 9); ctx.moveTo(x + 9, y - 9); ctx.lineTo(x - 9, y + 9); ctx.stroke();
    }
    if (layers.trail) {
      const st = r.track[sel];
      ctx.strokeStyle = 'rgba(236,227,207,.55)'; ctx.lineWidth = 2.5; ctx.beginPath();
      for (let j = Math.max(0, i - 25), gap = true; j <= i; j++) {
        if (!st.alive[j]) { gap = true; continue }
        gap ? ctx.moveTo(sx(st.x[j]), sy(st.y[j])) : ctx.lineTo(sx(st.x[j]), sy(st.y[j])); gap = false;
      }
      ctx.stroke();
    }
    let urnHero = null;
    for (const e of r.events || []) { if (e.t > t) break; if (e.kind === 'urn_pick') urnHero = e.hero; if (e.kind === 'urn_done' || e.kind === 'urn_drop') urnHero = null }
    const order = [...r.players].sort((a, b) => (a.hero_id === sel) - (b.hero_id === sel));
    for (const p of order) {
      const tr = r.track[p.hero_id], [wx, wy] = posAt(tr, t), x = sx(wx), y = sy(wy), alive = tr.alive[i];
      const isSel = p.hero_id === sel, rad = isSel ? 19 : 15;
      ctx.globalAlpha = alive ? 1 : .3;
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x, y, rad, 0, 7); ctx.fill();
      const im = img(HEROES[p.hero_id]?.mm);
      if (im?.complete && im.naturalWidth) {
        ctx.save(); ctx.beginPath(); ctx.arc(x, y, rad - 2, 0, 7); ctx.clip();
        if (!alive) ctx.filter = 'grayscale(1)';
        ctx.drawImage(im, x - rad, y - rad, rad * 2, rad * 2); ctx.restore();
      }
      ctx.strokeStyle = TEAM[p.team].color; ctx.lineWidth = isSel ? 4 : 3; ctx.beginPath(); ctx.arc(x, y, rad, 0, 7); ctx.stroke();
      if (isSel) { ctx.strokeStyle = '#ece3cf'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, rad + 3, 0, 7); ctx.stroke() }
      if (alive) {
        ctx.strokeStyle = tr.hp[i] > 50 ? '#5fbf8f' : tr.hp[i] > 25 ? '#e6c14a' : '#d4553f'; ctx.lineWidth = 3; ctx.beginPath();
        ctx.arc(x, y, rad + (isSel ? 7 : 4), -Math.PI / 2, -Math.PI / 2 + tr.hp[i] / 100 * Math.PI * 2); ctx.stroke();
        if (tr.ult?.[i]) { ctx.fillStyle = '#ffd34d'; ctx.beginPath(); ctx.arc(x + rad * .75, y - rad * .75, 4.5, 0, 7); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke() }
        if (urnHero === p.hero_id) { ctx.fillStyle = '#7fe0ff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('⚱', x - rad, y - rad) }
      }
      if (layers.names || isSel) {
        ctx.fillStyle = '#ece3cf'; ctx.font = `${isSel ? 'bold 13px' : '11px'} Onest, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.shadowColor = '#000'; ctx.shadowBlur = 3;
        ctx.fillText(isSel ? `${label(p)} · ${k(tr.souls?.[i] || 0)} душ` : p.hero, x, y + rad + 12);
        ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = 1;
    }
    if (focus && focus.x != null) {
      ctx.strokeStyle = focus.good ? '#5fbf8f' : '#d4553f'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(sx(focus.x), sy(focus.y), 36 + 6 * Math.sin(performance.now() / 150), 0, 7); ctx.stroke();
    }
    document.getElementById('clock').textContent = `${clock(t)} / ${r.clock}`;
    drawTimeline();
  }

  function seek(sec, f) {
    t = Math.max(0, sec); playing = false; document.getElementById('play').textContent = '▶'; focus = f || null;

  function renderBoard() {

                       objective: 'obj', urn: 'obj', shutdown: 'kill', solo: 'kill', multikill: 'kill'})[m.kind] || 'all';
  const stale = '<p class="muted">Этот матч разобран старой версией. Отправь <code>reanalyze ' + r.match_id + '</code> через «Разобрать матч», чтобы появились эти данные.</p>';

  function renderDetail() {
    const p = P[sel], s = p.stats, el = document.getElementById('detail');

      <div class="row">${heroIcon(p.hero_id, 'l')}<div><div class="eyebrow">${esc(p.hero)} · ${TEAM[p.team].name}</div>

      <div class="tabs">${[['overview', 'Обзор'], ['moments', `Моменты ${p.moments.length}`], ['lane', 'Линия'], ['combat', 'Бой'], ['items', 'Предметы'], ['farm', 'Фарм'], ['fights', `Драки ${p.fights.length}`], ['ult', 'Ульта']]
        .map(([k2, l]) => `<button data-tab="${k2}" class="${tab === k2 ? 'on' : ''}">${l}</button>`).join('')}</div>`;

      <div class="kpis">

      <h3 style="margin-top:12px">Самое важное</h3>

    } else if (tab === 'moments') {
      const list = p.moments.filter(m => (filter === 'all' || (filter === 'good') === m.good) && (cat === 'all' || catOf(m) === cat));
      body = `
      <div class="filters">${[['all', 'Все'], ['bad', 'Ошибки'], ['good', 'Хорошее']].map(([k2, l]) => `<button data-f="${k2}" class="${filter === k2 ? 'on' : ''}">${l}</button>`).join('')}</div>
      <div class="filters">${CATS.map(([k2, l]) => `<button data-c="${k2}" class="${cat === k2 ? 'on' : ''}">${l} ${k2 === 'all' ? p.moments.length : p.moments.filter(m => catOf(m) === k2).length}</button>`).join('')}</div>
      ${momentList(list)}`;
    } else if (tab === 'lane') {
      const L = p.lane_min;
      if (!L) body = stale; else {
        const foes = (L.foes || []).map(h => heroIcon(h, 's') + esc(heroName(h))).join(', ');
        body = `
        <p class="muted" style="margin:0 0 8px">Против: ${foes || '—'} (среднее по паре)</p>
        <canvas class="chart" id="laneChart" style="height:160px"></canvas>
        <div class="legend"><span><i style="background:var(--jade)"></i>впереди по душам</span><span><i style="background:var(--blood)"></i>позади</span></div>
        <div class="scroll"><table><thead><tr><th>Минута</th><th>Души</th><th>У врагов</th><th>Разница</th><th>Ластхиты</th><th>У врагов</th><th>Денаи</th></tr></thead><tbody>
          ${L.m.map((mm, i) => { const d = L.me.nw[i] - L.foe.nw[i];
            return `<tr class="click" data-t="${mm * 60}"><td class="num">${mm}:00</td><td class="num">${k(L.me.nw[i])}</td><td class="num muted">${k(L.foe.nw[i])}</td>
            <td class="num ${d >= 0 ? 'ok' : 'no'}">${d > 0 ? '+' : ''}${d}</td><td class="num">${L.me.lh[i]}</td><td class="num muted">${L.foe.lh[i]}</td><td class="num">${L.me.dn[i]}</td></tr>` }).join('')}
        </tbody></table></div>`;
      }
    } else if (tab === 'combat') {
      const c = p.combat;
      if (!c) body = stale; else {
        const tot = c.split.bullet + c.split.spirit + c.split.melee || 1;
        const tgt = Object.entries(c.by_target).sort((a, b) => b[1] - a[1]), src = Object.entries(c.by_source).sort((a, b) => b[1] - a[1]);
        const nemesis = Object.entries(c.killed_by).sort((a, b) => b[1] - a[1])[0], victim = Object.entries(c.killed).sort((a, b) => b[1] - a[1])[0];
        const bars = (list, color) => list.map(([h, v]) => `<div class="hbar"><span class="row" style="gap:6px">${heroIcon(+h, 's')}${esc(heroName(+h))}</span>
          <div class="track"><i style="width:${v / list[0][1] * 100}%;background:${color}"></i></div><span class="num">${k(v)}</span></div>`).join('') || '<p class="muted">—</p>';
        body = `
        <div class="kpis">
          <div class="kpi"><b>${s.hs_pct == null ? '—' : s.hs_pct + '%'}</b><span>хедшотов (${c.hs} из ${c.hits} попаданий)</span></div>
          <div class="kpi"><b>${k(tot)}</b><span>урон по героям</span></div>
          <div class="kpi"><b>${k(s.healing)}</b><span>лечение</span></div>
          ${nemesis ? `<div class="kpi"><b class="row" style="gap:6px">${heroIcon(+nemesis[0], 's')}×${nemesis[1]}</b><span>убивал тебя чаще всех</span></div>` : ''}
          ${victim ? `<div class="kpi"><b class="row" style="gap:6px">${heroIcon(+victim[0], 's')}×${victim[1]}</b><span>твоя любимая жертва</span></div>` : ''}
        </div>
        <h3>Чем бьёт</h3>
        <div class="split"><i style="width:${c.split.bullet / tot * 100}%;background:#e39a3b"></i><i style="width:${c.split.spirit / tot * 100}%;background:#b07cff"></i><i style="width:${c.split.melee / tot * 100}%;background:#ece3cf"></i></div>
        <div class="legend"><span><i style="background:#e39a3b"></i>пули ${Math.round(c.split.bullet / tot * 100)}%</span><span><i style="background:#b07cff"></i>способности ${Math.round(c.split.spirit / tot * 100)}%</span><span><i style="background:#ece3cf"></i>ближний бой ${Math.round(c.split.melee / tot * 100)}%</span></div>
        <div class="layout" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:10px">
          <div><h3>Кому наносил урон</h3>${bars(tgt, 'var(--brass)')}</div>
          <div><h3>От кого получал</h3>${bars(src, 'var(--blood)')}</div>
        </div>`;
      }
    } else if (tab === 'items') {
      if (!p.items) body = stale; else {
        const it = id => ITEMS[id] || {name: '?', slot: '', cost: 0};
        const tile = id => `<div class="item ${it(id).slot || ''}">${it(id).img ? `<img src="${it(id).img}" alt="">` : ''}<div><b>${esc(it(id).name)}</b><div class="muted num">${k(it(id).cost)}</div></div></div>`;
        body = `
        <div class="kpis"><div class="kpi"><b>${s.first_t3 == null ? '—' : clock(s.first_t3)}</b><span>первый предмет 3-го тира</span></div>
          <div class="kpi"><b>${p.items.filter(x => !x.sold).length}</b><span>покупок</span></div>
          <div class="kpi"><b>${p.items.filter(x => x.sold).length}</b><span>продаж</span></div></div>
        <h3>Сборка к концу матча</h3><div class="items">${p.build.map(tile).join('') || '<span class="muted">—</span>'}</div>
        <h3 style="margin-top:12px">Порядок покупок</h3>
        <div class="moments">${p.items.map(x => `<div class="mo" data-t="${x.t}"><span class="c">${clock(x.t)}</span>
          <div class="row" style="gap:8px">${it(x.id).img ? `<img class="ico ${it(x.id).slot || ''}" src="${it(x.id).img}" alt="">` : ''}
          <span class="${x.sold ? 'muted' : ''}">${x.sold ? 'продал ' : ''}<b>${esc(it(x.id).name)}</b></span><span class="muted num">${k(it(x.id).cost)}</span></div></div>`).join('')}</div>`;
      }
    } else if (tab === 'farm') {
      const src = p.farm.sources, tot = src.reduce((a, b) => a + b.gold, 0) || 1;
      body = `
      <div class="legend"><span><i style="background:#ece3cf"></i>${esc(label(p))}</span><span><i style="background:#d4553f"></i>враги по линии</span>
        <span><i style="background:${TEAM[p.team].color}"></i>среднее своей команды</span><span><i style="background:#98a196"></i>среднее лобби</span></div>
      <canvas class="chart" id="nwChart"></canvas>
      <div class="kpis">
        <div class="kpi"><b>${s.spm}</b><span>душ в минуту</span></div>
        <div class="kpi"><b>${s.camp_share}%</b><span>душ с кемпов</span></div>
        <div class="kpi"><b>${s.hoard_pct}%</b><span>времени с 3000+ в кармане</span></div>
        <div class="kpi"><b>${s.farm_bad}</b><span>провалов фарма</span></div>
      </div>
      <h3>Откуда души</h3>
      ${src.map(x => `<div class="hbar"><span>${esc(x.name)}</span><div class="track"><i style="width:${x.gold / src[0].gold * 100}%"></i></div><span class="num">${k(x.gold)} · ${Math.round(x.gold / tot * 100)}%</span></div>`).join('')}
      <h3 style="margin-top:12px">Фарм по ходу матча</h3>
      ${momentList(p.moments.filter(m => catOf(m) === 'farm'))}`;
    } else if (tab === 'fights') {
      body = p.fights.length ? `<div class="scroll"><table><thead><tr><th>Время</th><th>Итог</th><th>Счёт</th><th>Вход</th><th>K+A</th><th>Урон</th><th>% ком.</th><th>Получил</th><th>Умер</th><th>Ульта</th></tr></thead><tbody>
        ${p.fights.map(f => `<tr class="click" data-t="${f.t}"><td class="num">${f.clock}</td>
          <td class="${f.res === 'W' ? 'ok' : f.res === 'L' ? 'no' : 'meh'}">${f.res === 'W' ? 'победа' : f.res === 'L' ? 'поражение' : 'размен'}</td>
          <td class="num">${f.score}</td><td class="num ${f.join >= 6 ? 'no' : ''}">${f.join == null ? '—' : f.join + ' с'}</td><td class="num">${f.ka}</td><td class="num">${k(f.dmg)}</td><td class="num">${f.share}%</td><td class="num">${k(f.taken)}</td>
          <td>${f.died ? '<span class="no">да</span>' : '—'}</td>
          <td>${{used: '<span class="ok">прожал</span>', ready: '<span class="no">была готова</span>', cd: '<span class="muted">на кд</span>', none: '<span class="muted">нет</span>'}[f.ult]}</td></tr>`).join('')}
        </tbody></table></div>
        <p class="muted" style="font-size:12px">Клик по строке перематывает реплей.</p>
        ${momentList(p.moments.filter(m => catOf(m) === 'fight'))}` : '<p class="muted">Тимфайтов с участием игрока не найдено.</p>';
    } else if (tab === 'ult') {
      const u = p.ult;
      body = `
      <div class="kpis">
        <div class="kpi"><b>${u.unlocked || '—'}</b><span>ульта открыта</span></div>
        <div class="kpi"><b>${u.casts}</b><span>прожато раз</span></div>
        <div class="kpi"><b class="${u.idle_pct >= 50 ? 'no' : ''}">${u.idle_pct}%</b><span>времени лежала готовой</span></div>
        <div class="kpi"><b class="${u.deaths_ready ? 'no' : 'ok'}">${u.deaths_ready}</b><span>смертей с готовой ультой</span></div>
        <div class="kpi"><b class="ok">${u.fights_used}</b><span>драк с ультой</span></div>
        <div class="kpi"><b class="${u.fights_unused ? 'no' : ''}">${u.fights_unused}</b><span>драк без ульты при готовой</span></div>
      </div>
      <canvas class="chart" id="ultChart" style="height:60px"></canvas>
      <div class="muted" style="font-size:12px;margin:4px 0 8px">Жёлтое — ульта готова, тёмные метки — касты, красные — смерти.</div>
      ${momentList(p.moments.filter(m => catOf(m) === 'ult' || (m.kind === 'death' && m.text.includes('ульта'))))}`;
    }
    el.innerHTML = head + body;
    el.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; renderDetail() });
    el.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; renderDetail() });
    el.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { cat = b.dataset.c; renderDetail() });
    el.querySelectorAll('[data-t]').forEach(tr => tr.onclick = () => seek(Number(tr.dataset.t) - 3));
    el.querySelectorAll('.mo[data-m]').forEach(d => d.onclick = () => {
      const m = JSON.parse(d.dataset.m), tr = r.track[sel], i = Math.min(N - 1, Math.floor(m.t));
      seek(m.t - 5, {x: m.x ?? tr.x[i], y: m.y ?? tr.y[i], good: m.good});
    });
    if (tab === 'farm') drawFarm(p);
    if (tab === 'lane' && p.lane_min) drawLane(p.lane_min);
    if (tab === 'ult') drawUlt(p);
  }

  function benchBlock(p) {
    const b = BENCH?.heroes?.[p.hero_id];
    if (!b) return '';
    const mine = r.duration / 60, avgMin = BENCH.duration / 60, s = p.stats;
    const rows = [['Убийства', s.kills / mine, b.k / avgMin, 1], ['Смерти', s.deaths / mine, b.d / avgMin, -1], ['Ассисты', s.assists / mine, b.a / avgMin, 1],
                  ['Души', s.net_worth / mine, b.nw / avgMin, 1], ['Урон по героям', s.hero_damage / mine, b.dmg / avgMin, 1], ['Ластхиты', s.last_hits / mine, b.lh / avgMin, 1]];
    return `<h3 style="margin-top:12px">Против среднего ${esc(p.hero)}</h3>
      <div class="muted" style="font-size:12px;margin-bottom:4px">В минуту, против всех матчей на этом герое за 30 дней (${k(b.matches)} матчей, винрейт ${Math.round(b.winrate * 100)}%).</div>
      ${rows.map(([n, me, avg, dir]) => { const pct = avg ? (me / avg - 1) * 100 : 0, good = pct * dir >= 0;
        return `<div class="hbar"><span>${n}</span><div class="track"><i style="width:${Math.min(100, me / Math.max(me, avg) * 100)}%;background:${good ? 'var(--jade)' : 'var(--blood)'}"></i></div>
          <span class="num ${good ? 'ok' : 'no'}">${pct > 0 ? '+' : ''}${pct.toFixed(0)}%</span></div>` }).join('')}`;
  }

  function momentList(list) {
    return `<div class="moments">${list.map(m => `<div class="mo" data-m="${esc(JSON.stringify({t: m.t, x: m.x, y: m.y, good: m.good}))}"><span class="c">${m.clock}</span>
      <div><b class="${m.good ? 'g' : 'b'}">${esc(m.title)}</b><div class="muted">${esc(m.text)}</div></div></div>`).join('') || '<div class="muted">Пусто</div>'}</div>`;
  }

  function avgNw(ids) { return Array.from({length: N}, (_, i) => ids.reduce((a, h) => a + (r.track[h].nw[i] || 0), 0) / Math.max(1, ids.length)) }
  function drawFarm(p) {
    const foes = r.players.filter(o => o.team !== p.team && o.lane === p.lane).map(o => o.hero_id);
    const mates = r.players.filter(o => o.team === p.team && o.hero_id !== p.hero_id).map(o => o.hero_id);
    lineChart(document.getElementById('nwChart'), [
      {data: avgNw(r.players.map(o => o.hero_id)), color: '#98a196', dash: [4, 4]},
      {data: avgNw(mates), color: TEAM[p.team].color},
      {data: avgNw(foes), color: '#d4553f'},
      {data: r.track[p.hero_id].nw, color: '#ece3cf', width: 2.5},
    ], N, {marks: p.moments.filter(m => m.kind === 'farm').map(m => ({t: m.t, color: m.good ? '#5fbf8f88' : '#d4553f88'}))});
  }
  function drawLane(L) {
    const c = document.getElementById('laneChart'), dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
    c.width = w * dpr; c.height = h * dpr; const g = c.getContext('2d'); g.scale(dpr, dpr);
    const d = L.m.map((_, i) => L.me.nw[i] - L.foe.nw[i]), max = Math.max(500, ...d.map(Math.abs)), mid = h / 2, bw = (w - 40) / d.length;
    g.strokeStyle = '#2a3531'; g.beginPath(); g.moveTo(30, mid); g.lineTo(w, mid); g.stroke();
    g.font = '11px "Roboto Condensed", sans-serif'; g.fillStyle = '#98a196';
    g.fillText('+' + k(max), 0, 12); g.fillText('-' + k(max), 0, h - 4);
    d.forEach((v, i) => {
      const x = 34 + i * bw, bh = v / max * (mid - 10);
      g.fillStyle = v >= 0 ? '#5fbf8f' : '#d4553f'; g.fillRect(x, v >= 0 ? mid - bh : mid, bw - 6, Math.abs(bh));
      g.fillStyle = '#98a196'; g.fillText(L.m[i] + ':00', x + bw / 2 - 12, v >= 0 ? mid + 12 : mid - 4);
    });
  }
  function drawUlt(p) {
    const c = document.getElementById('ultChart'), dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
    c.width = w * dpr; c.height = h * dpr; const g = c.getContext('2d'); g.scale(dpr, dpr);
    const u = r.track[p.hero_id].ult || [];
    g.fillStyle = '#ffd34d';
    u.forEach((v, i) => { if (v) g.fillRect(i / N * w, 10, Math.ceil(w / N), h - 20) });
    g.fillStyle = '#d4553f';
    r.kills.filter(kl => kl.victim === p.hero_id).forEach(kl => g.fillRect(kl.t / N * w - 1, 0, 2, h));
    g.fillStyle = '#111';
    (p.ult.cast_times || []).forEach(ct => { const [mm, ss] = ct.split(':').map(Number); g.fillRect((mm * 60 + ss) / N * w - 1.5, 4, 3, h - 8) });
  }

  const toCanvas = e => { const rc = map.getBoundingClientRect(); return [(e.clientX - rc.left) * W / rc.width, (e.clientY - rc.top) * W / rc.height] };
  function zoomAt(f, mx = W / 2, my = W / 2) {
    const bx = view.cx + (mx - W / 2) / view.z, by = view.cy + (my - W / 2) / view.z;
    view.z *= f; clampView();
    if (!view.follow) { view.cx = bx - (mx - W / 2) / view.z; view.cy = by - (my - W / 2) / view.z; clampView() }
    draw();
  }
  map.addEventListener('wheel', e => { e.preventDefault(); const [mx, my] = toCanvas(e); zoomAt(e.deltaY < 0 ? 1.25 : 0.8, mx, my) }, {passive: false});
  let drag = null;
  map.addEventListener('pointerdown', e => { drag = toCanvas(e); map.setPointerCapture(e.pointerId); map.style.cursor = 'grabbing' });
  map.addEventListener('pointermove', e => {
    if (!drag) return;
    const [mx, my] = toCanvas(e);
    view.follow = false; document.getElementById('zfollow').classList.remove('on');
    view.cx -= (mx - drag[0]) / view.z; view.cy -= (my - drag[1]) / view.z; drag = [mx, my]; clampView(); draw();
  });
  map.addEventListener('pointerup', () => { drag = null; map.style.cursor = '' });
  map.addEventListener('dblclick', e => { const [mx, my] = toCanvas(e); zoomAt(2, mx, my) });
  document.getElementById('zin').onclick = () => zoomAt(1.5);
  document.getElementById('zout').onclick = () => zoomAt(1 / 1.5);
  document.getElementById('zreset').onclick = () => { view.z = 1; view.follow = false; document.getElementById('zfollow').classList.remove('on'); clampView(); draw() };
  document.getElementById('zfollow').onclick = e => {
    view.follow = !view.follow; e.target.classList.toggle('on', view.follow);
    if (view.follow && view.z < 2.5) view.z = 2.5;
    clampView(); draw();
  };

  document.getElementById('play').onclick = e => { playing = !playing; e.target.textContent = playing ? '❚❚' : '▶'; if (t >= N - 1) t = 0 };
  app.querySelectorAll('[data-sp]').forEach(bt => bt.onclick = () => {
    speed = Number(bt.dataset.sp); app.querySelectorAll('[data-sp]').forEach(x => x.classList.toggle('on', x === bt));
  });
  app.querySelectorAll('[data-layer]').forEach(cb => cb.onchange = () => {
    layers[cb.dataset.layer] = cb.checked; store.set('layers', layers); buildBg(); draw();
  });

  let last = performance.now(), alive = true;
  function loop(now) {
    if (!alive) return;
    const dt = (now - last) / 1000; last = now;
    if (playing) { t = Math.min(N - 1, t + dt * speed); if (t >= N - 1) playing = false }
    if (playing || focus) draw();
    requestAnimationFrame(loop);
  }
  stopReplay = () => { alive = false };
  renderBoard(); renderDetail(); draw(); requestAnimationFrame(loop);
}

route();
</script>
</body>
</html>
