name: Разобрать матч
description: Поставить матч или игрока в очередь на разбор
title: "match "
body:
  - type: markdown
    attributes:
      value: "Впиши в заголовок ID матча (можно ссылку), например `match 119848007`, или `player <ник>` для последних 5 матчей игрока. Через 5–10 минут бот ответит и матч появится на сайте."
