name: ruiner

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      request:
        description: "Match IDs, 'player <nick>', 'reanalyze <ids>' (empty = friends' new matches)"
        required: false
  issues:
    types: [opened]
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  analyze:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # every request runs on its own; reports are merged in datastore.py
    concurrency:
      group: analyze-${{ github.event.issue.number || github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore saved reports
        run: python datastore.py restore

      - name: Analyze issue request
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          python ruiner.py request "$TITLE
          $BODY" 2>/dev/null | tee result.txt || echo "Разбор упал, посмотри лог в Actions." >> result.txt
          printf '%s\n\nСайт обновится через пару минут.' "$(cat result.txt)" > comment.txt
          gh issue comment "$NUMBER" --body-file comment.txt
          gh issue close "$NUMBER"

      - name: Analyze manual request
        if: github.event_name == 'workflow_dispatch' && inputs.request != ''
        env:
          REQUEST: ${{ inputs.request }}
        run: python ruiner.py request "$REQUEST"

      - name: Analyze friends' new matches
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.request == '')
        run: python ruiner.py friends -n 5

      - name: Save reports
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: python datastore.py save

  deploy:
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build site from the latest reports
        run: |
          python datastore.py restore
          python ruiner.py reindex
          python assets.py --bench || echo "bench refresh skipped"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: pages
        uses: actions/deploy-pages@v4
